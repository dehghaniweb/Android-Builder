name: Android Cloud Builder

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false

      - name: Accept Android SDK licenses
        run: |
          yes | sdkmanager --licenses || true

      - name: Install Android SDK components
        run: |
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-35"
          sdkmanager "build-tools;35.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pillow pyyaml

      - name: Prepare build input
        run: |
          mkdir -p build_input
          mkdir -p build_output

          if [ ! -f "MyApp.zip" ]; then
            echo "ERROR: MyApp.zip not found in repository."
            echo ""
            echo "For this test, upload your project ZIP to the repository"
            echo "with the exact filename: MyApp.zip"
            exit 1
          fi

          cp "MyApp.zip" "build_input/MyApp.zip"

      - name: Run Android Builder
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          python build_engine.py \
            --project-name "MyApp" \
            --zip "build_input/MyApp.zip" \
            --version-code "1" \
            --version-name "1.0" \
            --output "build_output"

      - name: List build outputs
        if: always()
        run: |
          echo "=========================================="
          echo "BUILD OUTPUTS"
          echo "=========================================="
          find build_output -type f -maxdepth 3 -print 2>/dev/null || true

      - name: Upload build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Android-Builder-Output
          path: build_output/
          if-no-files-found: warn
          retention-days: 7
